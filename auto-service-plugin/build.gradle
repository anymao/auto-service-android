apply plugin: 'java-library'
apply plugin: 'groovy'
apply plugin: 'java'
apply plugin: 'java-gradle-plugin'
apply plugin: 'kotlin'
apply from:"../maven_publish.gradle"

repositories {
    google()
    mavenCentral()
    maven {
        credentials {
            username = "$ALIYUN_USERNAME"
            password = "$ALIYUN_PASSWORD"
        }
        url = 'https://packages.aliyun.com/maven/repository/2202395-release-jr0puW/'
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
}

sourceSets {
    main.kotlin.setSrcDirs([])
    pluginEntry {
        kotlin.srcDirs = ['src/main/kotlin']
        compileClasspath += files(
                layout.buildDirectory.dir('classes/groovy/main'),
                layout.buildDirectory.dir('classes/java/main'),
                layout.buildDirectory.dir('resources/main')) + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    pluginEntryImplementation.extendsFrom implementation
    pluginEntryCompileOnly.extendsFrom compileOnly
}

tasks.named('compilePluginEntryKotlin') {
    dependsOn tasks.named('compileGroovy')
}

tasks.named('classes') {
    dependsOn tasks.named('pluginEntryClasses')
}

tasks.named('jar') {
    from sourceSets.pluginEntry.output
}

tasks.named('pluginUnderTestMetadata') {
    pluginClasspath.from(sourceSets.pluginEntry.output)
}

dependencies {
    compileOnly(gradleApi())
    compileOnly(localGroovy())
    compileOnly("com.android.tools.build:gradle:8.13.0")
    implementation('com.squareup:javapoet:1.13.0')
    implementation("com.android.tools.build:gradle:8.13.0")
    implementation("commons-io:commons-io:2.8.0")
    implementation("commons-codec:commons-codec:1.15")
    implementation("org.javassist:javassist:3.28.0-GA")
    implementation("org.jetbrains:annotations:13.0")
    testImplementation gradleTestKit()
    testImplementation localGroovy()
    testImplementation project(':auto-service-annotation')
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly project(':auto-service-loader')
    testRuntimeOnly project(':auto-service-registry')
}

test {
    useJUnit()
    classpath += sourceSets.pluginEntry.output
}

gradlePlugin {
    plugins {
        autoService {
            id = 'auto-service'
            implementationClass = 'com.anymore.auto.gradle.AutoServiceRegisterPlugin'
        }
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

group = 'com.anymore'
version = VERSION

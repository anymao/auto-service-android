plugins {
    id 'com.android.application' version '8.13.0'
    id 'auto-service'
}

android {
    namespace 'test.sample'
    compileSdk 35

    defaultConfig {
        applicationId 'test.sample'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    compileOnly files('../libs/auto-service-annotation.jar')
    implementation files('../libs/auto-service-loader.jar')
    implementation files('../libs/auto-service-registry.jar')
    implementation project(':feature')
}

tasks.register('verifyAutoServiceOutputs') {
    dependsOn 'assembleDebug', 'assembleRelease'

    doLast {
        ['Debug', 'Release'].each { variant ->
            def transformTask = tasks.named("androidAutoServiceRegister${variant}").get()
            def output = transformTask.outputJar.get().asFile
            assert output.isFile(): "${variant} 变换输出不存在：${output}"

            def archive = new java.util.zip.ZipFile(output)
            try {
                assert archive.getEntry('test/sample/ServiceImpl.class') != null: "${variant} 输出缺少服务实现类"
                assert archive.getEntry('feature/FeatureTask.class') != null: "${variant} 输出缺少 feature 模块服务"
                assert archive.getEntry('com/anymore/auto/ServiceRegistry.class') != null: "${variant} 输出缺少生成的服务注册表"
                assert archive.getEntry('com/anymore/auto/ServiceRegistryDiagnostics.class') != null: "${variant} 输出缺少生成的诊断注册表"
            } finally {
                archive.close()
            }
        }
        assert tasks.named('androidAutoServiceRegisterDebug').get().diagnosticsEnabled.get()
        assert !tasks.named('androidAutoServiceRegisterRelease').get().diagnosticsEnabled.get()
    }
}

tasks.register('verifyAutoServiceRuntime') {
    dependsOn 'assembleDebug'

    doLast {
        def transformTask = tasks.named('androidAutoServiceRegisterDebug').get()
        def output = transformTask.outputJar.get().asFile
        def loaderJar = file('../libs/auto-service-loader.jar')
        def registryJar = file('../libs/auto-service-registry.jar')
        def kotlinRuntime = Class.forName('kotlin.Unit').protectionDomain.codeSource.location
        def classLoader = new java.net.URLClassLoader(
                [output.toURI().toURL(), loaderJar.toURI().toURL(), registryJar.toURI().toURL(), kotlinRuntime] as URL[],
                ClassLoader.getPlatformClassLoader())
        try {
            def serviceLoaderClass = classLoader.loadClass('com.anymore.auto.ServiceLoader')
            def services = serviceLoaderClass.getMethod('load', Class, String).invoke(null, Runnable.class, '')
            def iterator = (services as Iterable).iterator()
            assert iterator.hasNext(): '生成的注册表未发现 Runnable 服务'
            assert iterator.next().class.name == 'test.sample.ServiceImpl': 'App 服务应按优先级排在首位'
            assert iterator.hasNext(): '生成的注册表未发现 feature 模块 Runnable 服务'
            assert iterator.next().class.name == 'feature.FeatureTask': 'feature 模块服务类型错误'
            assert !iterator.hasNext(): '夹具只声明了两个 Runnable 服务'
            def report = serviceLoaderClass.getMethod('diagnose', Class, String).invoke(null, Runnable.class, '')
            assert report.availability.name() == 'AVAILABLE': 'Debug 诊断应可用'
            assert report.registeredCount == 2: 'Debug 诊断应包含跨模块注册项'
        } finally {
            classLoader.close()
        }
    }
}

tasks.register('verifyExcludedAutoServiceRuntime') {
    dependsOn 'assembleDebug'

    doLast {
        def transformTask = tasks.named('androidAutoServiceRegisterDebug').get()
        def output = transformTask.outputJar.get().asFile
        def loaderJar = file('../libs/auto-service-loader.jar')
        def registryJar = file('../libs/auto-service-registry.jar')
        def kotlinRuntime = Class.forName('kotlin.Unit').protectionDomain.codeSource.location
        def classLoader = new java.net.URLClassLoader(
                [output.toURI().toURL(), loaderJar.toURI().toURL(), registryJar.toURI().toURL(), kotlinRuntime] as URL[],
                ClassLoader.getPlatformClassLoader())
        try {
            def serviceLoaderClass = classLoader.loadClass('com.anymore.auto.ServiceLoader')
            def services = serviceLoaderClass.getMethod('load', Class, String).invoke(null, Runnable.class, '')
            def iterator = (services as Iterable).iterator()
            assert iterator.hasNext(): '排除 App 服务后应保留 feature 服务'
            assert iterator.next().class.name == 'feature.FeatureTask': '排除后保留了错误实现'
            assert !iterator.hasNext(): '被排除的 App 服务不应返回'
            def report = serviceLoaderClass.getMethod('diagnose', Class, String).invoke(null, Runnable.class, '')
            assert report.entries.size() == 2: '诊断应保留跨模块候选和排除候选'
            def excluded = report.entries.find { it.implementationClassName == 'test.sample.ServiceImpl' }
            assert excluded.status.name() == 'EXCLUDED': '诊断候选状态应为 EXCLUDED'
        } finally {
            classLoader.close()
        }
    }
}

tasks.register('verifyAliasedAutoServiceRuntime') {
    dependsOn 'assembleDebug'

    doLast {
        def transformTask = tasks.named('androidAutoServiceRegisterDebug').get()
        def output = transformTask.outputJar.get().asFile
        def loaderJar = file('../libs/auto-service-loader.jar')
        def registryJar = file('../libs/auto-service-registry.jar')
        def kotlinRuntime = Class.forName('kotlin.Unit').protectionDomain.codeSource.location
        def classLoader = new java.net.URLClassLoader(
                [output.toURI().toURL(), loaderJar.toURI().toURL(), registryJar.toURI().toURL(), kotlinRuntime] as URL[],
                ClassLoader.getPlatformClassLoader())
        try {
            def serviceLoaderClass = classLoader.loadClass('com.anymore.auto.ServiceLoader')
            def services = serviceLoaderClass.getMethod('load', Class, String).invoke(null, Runnable.class, 'secondary')
            def iterator = (services as Iterable).iterator()
            assert iterator.hasNext(): '别名为 secondary 的服务未被发现'
            assert iterator.next().class.name == 'test.sample.SecondaryServiceImpl': '别名过滤返回了错误的服务实现'
            assert !iterator.hasNext(): '别名过滤后应只保留一个服务实现'
        } finally {
            classLoader.close()
        }
    }
}

tasks.register('verifyAllScopeRuntime') {
    dependsOn 'assembleDebug', 'assembleRelease'

    doLast {
        def expectedClasses = [
                'test.sample.ServiceImpl',
                'feature.FeatureTask',
                'test.java.JavaModuleTask',
                'test.external.ExternalTask',
                'test.external.BridgeTask'
        ]
        def expectedAliases = ['app', 'feature', 'java', 'external', 'bridge']
        def loaderJar = file('../libs/auto-service-loader.jar')
        def registryJar = file('../libs/auto-service-registry.jar')
        def kotlinRuntime = Class.forName('kotlin.Unit').protectionDomain.codeSource.location

        ['Debug', 'Release'].each { variant ->
            def output = tasks.named("androidAutoServiceRegister${variant}").get().outputJar.get().asFile
            def classLoader = new java.net.URLClassLoader(
                    [output.toURI().toURL(), loaderJar.toURI().toURL(), registryJar.toURI().toURL(), kotlinRuntime] as URL[],
                    ClassLoader.getPlatformClassLoader())
            try {
                def serviceLoaderClass = classLoader.loadClass('com.anymore.auto.ServiceLoader')
                def services = serviceLoaderClass.getMethod('load', Class, String)
                        .invoke(null, Runnable.class, '')
                assert (services as Iterable).collect { it.class.name } == expectedClasses: "${variant} 服务顺序错误"
                expectedAliases.eachWithIndex { String alias, int index ->
                    def matching = serviceLoaderClass.getMethod('load', Class, String)
                            .invoke(null, Runnable.class, alias)
                    assert (matching as Iterable).collect { it.class.name } == [expectedClasses[index]]: "${variant} alias=${alias} 匹配错误"
                }

                def report = serviceLoaderClass.getMethod('diagnose', Class, String)
                        .invoke(null, Runnable.class, '')
                if (variant == 'Debug') {
                    assert report.availability.toString() == 'AVAILABLE'
                    assert report.registeredCount == 5
                    assert report.availableAliases == expectedAliases as Set
                    def excluded = report.entries.find {
                        it.implementationClassName == 'test.external.ExcludedExternalTask'
                    }
                    assert excluded != null: 'Debug 诊断缺少被排除的外部 AAR 实现'
                    assert excluded.status.toString() == 'EXCLUDED'
                } else {
                    assert report.availability.toString() == 'UNAVAILABLE_IN_NON_DEBUG_BUILD'
                    assert report.entries.empty
                    def archive = new java.util.zip.ZipFile(output)
                    try {
                        def entry = archive.getEntry('com/anymore/auto/ServiceRegistryDiagnostics.class')
                        def constants = [] as Set
                        def input = new java.io.DataInputStream(archive.getInputStream(entry))
                        assert input.readInt() == -889275714
                        input.readUnsignedShort()
                        input.readUnsignedShort()
                        int constantPoolCount = input.readUnsignedShort()
                        for (int index = 1; index < constantPoolCount; index++) {
                            int tag = input.readUnsignedByte()
                            switch (tag) {
                                case 1:
                                    constants.add(input.readUTF())
                                    break
                                case 3:
                                case 4:
                                    input.skipBytes(4)
                                    break
                                case 5:
                                case 6:
                                    input.skipBytes(8)
                                    index++
                                    break
                                case 7:
                                case 8:
                                case 16:
                                case 19:
                                case 20:
                                    input.skipBytes(2)
                                    break
                                case 9:
                                case 10:
                                case 11:
                                case 12:
                                case 17:
                                case 18:
                                    input.skipBytes(4)
                                    break
                                case 15:
                                    input.skipBytes(3)
                                    break
                                default:
                                    assert false: "未知的 class 常量池标签：${tag}"
                            }
                        }
                        input.close()
                        (expectedClasses + expectedAliases + [
                                'test.external.ExcludedExternalTask',
                                'test\\.external\\.ExcludedExternalTask'
                        ]).each { forbidden ->
                            assert !constants.contains(forbidden): "Release 诊断泄露候选元数据：${forbidden}"
                        }
                    } finally {
                        archive.close()
                    }
                }
            } finally {
                classLoader.close()
            }
        }
    }
}

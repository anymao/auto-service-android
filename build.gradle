// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = "2.1.0"
    ext.maven_username = providers.environmentVariable('ALIYUN_USERNAME')
            .orElse(providers.gradleProperty('ALIYUN_USERNAME')).orNull
    ext.maven_password = providers.environmentVariable('ALIYUN_PASSWORD')
            .orElse(providers.gradleProperty('ALIYUN_PASSWORD')).orNull
    ext.has_private_maven_credentials = maven_username && maven_password
    repositories {
        google()
        mavenCentral()
        if (has_private_maven_credentials) {
            maven {
                credentials {
                    username = maven_username
                    password = maven_password
                }
                url = 'https://packages.aliyun.com/maven/repository/2202395-release-jr0puW/'
            }
        }
//        maven {
//            credentials {
//                username "$ALIYUN_USERNAME"
//                password "$ALIYUN_PASSWORD"
//            }
//            url 'https://packages.aliyun.com/maven/repository/2202395-snapshot-3OoSzj/'
//        }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
//        classpath("com.anymore:auto-service-register:0.0.11")
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }

    configurations.all {

        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
        resolutionStrategy.cacheDynamicVersionsFor 0, 'seconds'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        if (rootProject.ext.has_private_maven_credentials) {
            maven {
                credentials {
                    username = rootProject.ext.maven_username
                    password = rootProject.ext.maven_password
                }
                url = 'https://packages.aliyun.com/maven/repository/2202395-release-jr0puW/'
            }
            maven {
                credentials {
                    username = rootProject.ext.maven_username
                    password = rootProject.ext.maven_password
                }
                url = 'https://packages.aliyun.com/maven/repository/2202395-snapshot-3OoSzj/'
            }
        }
    }
    configurations.all {

        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
        resolutionStrategy.cacheDynamicVersionsFor 0, 'seconds'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
